<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Responsive check</title><style>*{box-sizing:border-box}body{margin:0;background:#e9edf4;color:#162139;font:14px system-ui}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;background:white;border-bottom:1px solid #bcc7da}label{display:flex;align-items:center;gap:6px}select{padding:8px;font:inherit}#stage{margin:18px auto;position:relative;background:white;box-shadow:0 4px 24px #0002}iframe{border:0;display:block;transform-origin:top left}#status{font-size:13px}</style></head><body><header><label>Viewport<select id="size"><option value="320,740">Phone 320 × 740</option><option value="375,812">Phone 375 × 812</option><option value="390,844" selected>Phone 390 × 844</option><option value="430,932">Phone 430 × 932</option><option value="844,390">Phone landscape 844 × 390</option><option value="768,1024">Tablet 768 × 1024</option><option value="1024,768">Tablet landscape 1024 × 768</option><option value="1366,900">Desktop 1366 × 900</option><option value="1600,1000">Wide 1600 × 1000</option></select></label><label>Page<select id="route"><option value="index.html#education">Education</option><option value="index.html">Home and interests</option><option value="index.html#research">Research cards</option><option value="index.html#experience">Experience</option><option value="index.html#coursework">Coursework</option><option value="publications.html">Publications</option><option value="cv.html">CV</option><option value="research/private-data.html">Privacy paper</option><option value="research/robust-learning.html">Distillation paper</option><option value="research/scientific-learning.html">CuPINN paper</option><option value="research/private-sampling.html">Sampling paper</option><option value="research/private-covariance.html">Covariance paper</option><option value="research/sgd-robustness.html">SGD paper</option><option value="404.html">404 page</option></select></label><span id="status" role="status">Loading</span></header><div id="stage"><iframe id="site" title="Site viewport" src="index.html#education"></iframe></div><script>const size=document.getElementById('size'),route=document.getElementById('route'),frame=document.getElementById('site'),stage=document.getElementById('stage'),status=document.getElementById('status');function fit(){const [w,h]=size.value.split(',').map(Number),scale=Math.min(1,(innerWidth-40)/w);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';stage.style.width=w*scale+'px';stage.style.height=h*scale+'px';status.textContent=w+' × '+h+' CSS pixels'}size.addEventListener('change',fit);route.addEventListener('change',()=>{status.textContent='Loading';frame.src=route.value});frame.addEventListener('load',fit);addEventListener('resize',fit);fit();</script></body></html>
